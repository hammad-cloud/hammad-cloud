.ln{opacity:0;animation:fade .35s ease forwards}
@keyframes fade{to{opacity:1}}
@keyframes reveal{from{height:0}to{height:390px}}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(360px)}}
@keyframes blink{50%{opacity:0}}
